  <!-- 单元格文字 -->
  <g text-anchor="middle">
    <text x="45" y="124">1</text>
    <text x="150" y="124">近战弧击</text>
    <text x="330" y="124">职业默认/招式</text>
    <text x="545" y="124">剑修基础普攻弧形挥击</text>

    <text x="45" y="162">2</text>
    <text x="150" y="162">旋风</text>
    <text x="330" y="162">主修招式</text>
    <text x="545" y="162">招式自带旋转范围攻击</text>

    <text x="45" y="200">3</text>
    <text x="150" y="200">飞剑</text>
