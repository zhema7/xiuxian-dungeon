<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" width="680" height="560" font-family="宋体" font-size="12">
  <!-- 背景 -->
  <rect x="0" y="0" width="680" height="560" fill="#ffffff"/>
  <text x="340" y="30" text-anchor="middle" font-size="15" font-weight="bold">图 3  攻击形态（AttackMode）映射表</text>

