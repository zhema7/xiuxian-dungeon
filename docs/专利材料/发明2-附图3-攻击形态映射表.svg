    <text x="545" y="314">套装改写：大范围冰环冻结</text>

    <text x="45" y="352">7</text>
    <text x="150" y="352">冰爆</text>
    <text x="330" y="352">玄冥法套 + 招式</text>
    <text x="545" y="352">冰环后深度冻结爆发</text>

    <text x="45" y="390">8</text>
    <text x="150" y="390">雷链</text>
    <text x="330" y="390">紫霄雷套 4 件</text>
    <text x="545" y="390">套装改写：闪电链跳跃</text>

    <text x="45" y="428">9</text>
    <text x="150" y="428">剑阵</text>
    <text x="330" y="428">凡人套 4 件(神通)</text>
    <text x="545" y="428">套装改写神通：大庚剑阵</text>

    <text x="45" y="466">10</text>
    <text x="150" y="466">巨剑</text>
    <text x="330" y="466">主修招式</text>
    <text x="545" y="466">招式重劈巨型剑气</text>
  </g>

  <text x="20" y="510" font-size="11" fill="#555555">说明：攻击形态由优先级链求值得出；标"套装 N 件"者为套装达件数阈值改写，</text>
  <text x="20" y="528" font-size="11" fill="#555555">标"神通"者经 resolveSetArtMode 同步改写神通形态。具体映射以配置数据为准（数据驱动）。</text>
