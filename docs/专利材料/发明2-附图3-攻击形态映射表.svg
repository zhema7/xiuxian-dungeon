    <rect x="230" y="252" width="200" height="38"/>
    <rect x="430" y="252" width="230" height="38"/>

    <rect x="20" y="290" width="50" height="38"/>
    <rect x="70" y="290" width="160" height="38"/>
    <rect x="230" y="290" width="200" height="38"/>
    <rect x="430" y="290" width="230" height="38"/>

    <rect x="20" y="328" width="50" height="38"/>
