<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" width="680" height="520" font-family="宋体" font-size="13">
  <!-- 背景 -->
  <rect x="0" y="0" width="680" height="520" fill="#ffffff"/>
  <!-- 图标题 -->
  <text x="340" y="30" text-anchor="middle" font-size="15" font-weight="bold">图 1  修饰聚合数据流图</text>

  <!-- 来源容器 -->
  <rect x="20" y="60" width="220" height="320" fill="none" stroke="#000000" stroke-dasharray="6 4"/>
  <text x="130" y="80" text-anchor="middle">多来源修饰</text>

  <!-- 四个来源 -->
  <rect x="50" y="100" width="160" height="40" fill="#ffffff" stroke="#000000"/>
  <text x="130" y="125" text-anchor="middle">装备基座 + 词缀</text>
  <rect x="50" y="160" width="160" height="40" fill="#ffffff" stroke="#000000"/>
  <text x="130" y="185" text-anchor="middle">套装阶梯效果</text>
  <rect x="50" y="220" width="160" height="40" fill="#ffffff" stroke="#000000"/>
  <text x="130" y="245" text-anchor="middle">心法（按等级缩放）</text>
  <rect x="50" y="280" width="160" height="40" fill="#ffffff" stroke="#000000"/>
  <text x="130" y="305" text-anchor="middle">天赋</text>

  <!-- 聚合函数 -->
  <rect x="300" y="180" width="120" height="50" fill="#ffffff" stroke="#000000"/>
  <text x="360" y="205" text-anchor="middle">aggregateMods</text>
  <text x="360" y="222" text-anchor="middle">（单一累加）</text>

  <!-- 来源 → 聚合 箭头 -->
  <line x1="210" y1="120" x2="300" y2="190" stroke="#000000"/>
  <line x1="210" y1="180" x2="300" y2="195" stroke="#000000"/>
  <line x1="210" y1="240" x2="300" y2="205" stroke="#000000"/>
  <line x1="210" y1="300" x2="300" y2="215" stroke="#000000"/>

  <!-- Mods 向量 -->
  <rect x="470" y="150" width="190" height="110" fill="#ffffff" stroke="#000000"/>
  <text x="565" y="172" text-anchor="middle" font-weight="bold">统一修饰向量 Mods</text>
  <text x="565" y="192" text-anchor="middle">atk / def / speed / crit</text>
  <text x="565" y="212" text-anchor="middle">maxHp / atkPct / defPct</text>
  <text x="565" y="232" text-anchor="middle">hpPct / aspd / lifesteal</text>
  <text x="565" y="252" text-anchor="middle">skillPct / cdPct（12 键）</text>

  <!-- 聚合 → Mods -->
  <line x1="420" y1="205" x2="470" y2="205" stroke="#000000"/>

  <!-- Mods 分叉 -->
  <line x1="565" y1="260" x2="565" y2="300" stroke="#000000"/>
  <line x1="565" y1="300" x2="300" y2="350" stroke="#000000"/>
  <line x1="565" y1="300" x2="565" y2="350" stroke="#000000"/>
  <text x="430" y="335" text-anchor="middle">calcStats</text>
  <text x="640" y="335" text-anchor="middle">resolveAttackMode</text>

  <!-- 两路输出 -->
  <rect x="220" y="350" width="160" height="45" fill="#ffffff" stroke="#000000"/>
  <text x="300" y="378" text-anchor="middle">角色属性计算</text>
  <rect x="480" y="350" width="160" height="45" fill="#ffffff" stroke="#000000"/>
  <text x="560" y="378" text-anchor="middle">攻击形态求值</text>

  <!-- 汇聚到单键 -->
  <line x1="300" y1="395" x2="300" y2="430" stroke="#000000"/>
  <line x1="560" y1="395" x2="560" y2="430" stroke="#000000"/>
  <line x1="300" y1="430" x2="520" y2="430" stroke="#000000"/>
  <line x1="560" y1="430" x2="520" y2="430" stroke="#000000"/>
  <rect x="380" y="412" width="200" height="36" fill="#ffffff" stroke="#000000"/>
  <text x="480" y="435" text-anchor="middle">单一攻击键触发</text>

  <!-- 附图标记 -->
  <text x="20" y="510" font-size="11" fill="#555555">说明：所有来源经同一 aggregateMods 累加为 Mods，再分别驱动属性与形态求值。</text>
</svg>
