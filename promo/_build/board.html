  .card { position:relative; overflow:hidden; flex:none; background:#0b1027; }
  .card.plain { background:transparent; }

  .tt { position:relative; display:inline-block; line-height:1; white-space:nowrap; }
  .tt .stroke, .tt .fill { font-family:'STXingkai','华文行楷','STKaiti','华文楷体','KaiTi',serif; letter-spacing:.045em; }
  .tt .stroke { position:absolute; inset:0; color:transparent;

    filter:drop-shadow(0 0 .10em rgba(255,196,96,.85)) drop-shadow(0 0 .60em rgba(255,168,60,.55)) drop-shadow(0 0 1.6em rgba(255,150,40,.35)); }
  .tt .fill { position:relative;
    background:linear-gradient(180deg,#fffdf3 0%,#fff0bd 16%,#f8cd63 42%,#e0a223 62%,#b97708 76%,#f3d68a 92%,#fff6d8 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent; }

  .tag { font-family:'STKaiti','华文楷体','KaiTi',serif; color:#cfe0f5; letter-spacing:.42em; }
  .stars, .sprk, .mist, .mtn, .fx { position:absolute; inset:0; width:100%; height:100%; }
  .vig { position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(120% 92% at 50% 44%, rgba(0,0,0,0) 38%, rgba(4,6,16,.50) 80%, rgba(2,3,10,.88) 100%); }
  .frame { position:absolute; pointer-events:none; border:2px solid rgba(244,203,110,.35); }

  <div class="sprk" data-sprk="240"></div>
</div>

<script>
// ---- 确定性随机 ----
function rng(seed) { let s = seed >>> 0; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }

// ---- 星空 ----
document.querySelectorAll('.stars[data-stars]').forEach((el) => {
  const n = +el.dataset.stars, r = rng(n * 977 + 13);
  let out = '';
  for (let i = 0; i < n; i++) {
    const x = r() * 100, y = r() * 60, big = r() < 0.08;
    const s = big ? 0.20 : 0.09, o = (0.18 + r() * 0.72).toFixed(2);
    out += `<rect x="${x.toFixed(3)}%" y="${y.toFixed(3)}%" width="${s}%" height="${s}%" fill="#ffffff" opacity="${o}"/>`;
  }
  el.innerHTML = `<svg viewBox="0 0 1000 1000" preserveAspectRatio="none" style="width:100%;height:100%">${out}</svg>`;
});

// ---- 金色浮尘 ----
document.querySelectorAll('.sprk[data-sprk]').forEach((el) => {
  const n = +el.dataset.sprk, r = rng(n * 613 + 7);
  let out = '';
  for (let i = 0; i < n; i++) {
    const x = r() * 100, y = 26 + r() * 74, s = 0.12 + r() * 0.34, o = (0.25 + r() * 0.6).toFixed(2);
    out += `<rect x="${x.toFixed(3)}%" y="${y.toFixed(3)}%" width="${s}%" height="${s}%" fill="#ffd27a" opacity="${o}"/>`;
  }
  el.innerHTML = `<svg viewBox="0 0 1000 1000" preserveAspectRatio="none" style="width:100%;height:100%">${out}</svg>`;
});

// ---- 仙鹤（白羽 / 黑翼尖 / 丹顶 / 金喙） ----
const CRANE = `
  <g>
    <path d="M52 26 C38 2, 12 -14, -18 -20 C8 -4, 26 12, 40 30 Z" fill="#f3f7ff"/>
    <path d="M-18 -20 C-4 -12, 8 -2, 18 8 C4 -2, -8 -12, -18 -20 Z" fill="#242a44"/>
    <path d="M-18 -20 C-30 -22, -44 -26, -58 -32 C-42 -20, -28 -16, -16 -14 Z" fill="#1b2038"/>
    <path d="M50 42 C34 62, 8 76, -22 82 C4 68, 26 56, 42 40 Z" fill="#e9eefc"/>
    <path d="M-22 82 C-34 84, -48 88, -62 94 C-46 82, -32 78, -20 78 Z" fill="#242a44"/>
    <path d="M-4 44 C-18 40, -34 40, -50 44 C-34 34, -16 34, -2 38 Z" fill="#dfe6fa"/>
    <ellipse cx="46" cy="36" rx="22" ry="9" fill="#f7faff"/>
    <path d="M64 32 C74 28, 82 25, 88 26" stroke="#f7faff" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="91" cy="25" r="4.4" fill="#f7faff"/>
    <path d="M88 18 l3.6 -6.4 l4 6.4 z" fill="#c8452c"/>
    <path d="M95 24 l9 2 l-9 2.6 z" fill="#e9b23c"/>
    <path d="M34 44 l-9 13" stroke="#e9b23c" stroke-width="2.1" stroke-linecap="round"/>
    <path d="M44 46 l-3 14" stroke="#e9b23c" stroke-width="2.1" stroke-linecap="round"/>
  </g>`;
document.querySelectorAll('[data-crane]').forEach((g) => { g.innerHTML = CRANE; });

// ---- 标题宽度自适应：实测字宽，保证不贴边、不被卡片裁切 ----
async function fitTitles() {
  if (document.fonts && document.fonts.ready) { try { await document.fonts.ready } catch (e) {} }
  const report = [];
  document.querySelectorAll('.card[data-safe]').forEach((card) => {
    const tt = card.querySelector('.tt');
    if (!tt) return;
    const safe = +card.dataset.safe;
    const cardW = card.getBoundingClientRect().width;
    let fs = parseFloat(getComputedStyle(tt).fontSize);
    const limit = cardW - 2 * safe;
    let guard = 0;
    while (tt.getBoundingClientRect().width > limit && fs > 20 && guard++ < 300) {
      fs -= 1; tt.style.fontSize = fs + 'px';
    }
    const w = tt.getBoundingClientRect().width;
    report.push({ card: card.id, font: Math.round(fs), textW: Math.round(w),
                  cardW: Math.round(cardW), margin: Math.round((cardW - w) / 2), safe });
  });
  window.__fitReport = report;
}
fitTitles();
</script>
</body>
</html>
